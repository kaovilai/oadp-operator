name: Sync Fork

on:
  # schedule:
  #   - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: # on button click

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - base: oadp-dev
          head: oadp-dev
        - base: oadp-1.6
          head: oadp-1.6
        - base: oadp-1.5
          head: oadp-1.5
        - base: oadp-1.4
          head: oadp-1.4
        - base: oadp-1.3
          head: oadp-1.3
        - base: oadp-1.2
          head: oadp-1.2
        - base: oadp-1.1
          head: oadp-1.1
        - base: oadp-1.0
          head: oadp-1.0
      fail-fast: false
    steps:
      - uses: tgymnich/fork-sync@v1.6.3
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          owner: openshift
          base: ${{ matrix.base }}
          head: ${{ matrix.head }}