name: edge-catalog
on:
  push:
    branches: [edge]
    paths:
      - ".github/workflows/edge-catalog.yml"
      - "appendMakefile"
      - "appendMakefile.modern"
      - "appendMakefile.legacy"
  schedule:
  - cron: '30 1-22/3 * * *'
  - cron: '0 0-21/3 * * *'
  workflow_dispatch: # Manual trigger builds all channels
      
  watch:
    types: [started]
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
jobs:
  publish-new-edge-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - branch: oadp-dev
          channel: dev
        - branch: oadp-1.6
          channel: stable-1.6
        - branch: oadp-1.5
          channel: stable-1.5
        - branch: oadp-1.4
          channel: stable-1.4
        - branch: oadp-1.3
          channel: stable-1.3
        - branch: oadp-1.2
          channel: stable-1.2
        - branch: oadp-1.1
          channel: stable-1.1
        - branch: oadp-1.0
          channel: stable-1.0
    env:
      EVENT_NAME: ${{ github.event_name }}
      UPSTREAM_BRANCH: ${{ matrix.branch }}
      CHANNEL: ${{ matrix.channel }}
    steps:
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    # In this step, this action saves a list of existing images,
    # the cache is created without them in the post run.
    # It also restores the cache if it exists.
    - uses: satackey/action-docker-layer-caching@v0.0.11
      # Ignore the failure of a step and avoid terminating the job.
      continue-on-error: true
    - uses: actions/checkout@v6
    - name: Get upstream/${{ matrix.branch }}
      run: |
        git remote -vv
        git remote add upstream https://github.com/openshift/oadp-operator.git
        git fetch upstream
    - name: Reset to upstream/${{ matrix.branch }}
      run: |
        git reset upstream/${{ matrix.branch }}
        # Determine which appendMakefile to use based on branch
        case "${{ matrix.branch }}" in
          oadp-dev|oadp-1.6|oadp-1.5)
            echo "Using modern File-Based Catalog appendMakefile"
            APPEND_FILE=appendMakefile.modern
            ;;
          oadp-1.4|oadp-1.3|oadp-1.2|oadp-1.1|oadp-1.0)
            echo "Using legacy SQLite index appendMakefile"
            APPEND_FILE=appendMakefile.legacy
            ;;
          *)
            echo "Unknown branch, defaulting to modern appendMakefile"
            APPEND_FILE=appendMakefile.modern
            ;;
        esac
        git add $APPEND_FILE # preserve the chosen appendMakefile
        git restore . # discard old changes
        # Append the appropriate Makefile
        cat $APPEND_FILE >> Makefile
        echo "upstream/${{ matrix.branch }}" > /tmp/rev-parse-head
        echo "${{ matrix.channel }}" > /tmp/tag
    - run: cat Makefile
    - name: get git ref
      id: git-ref
      run: echo "GIT_REF=$(git rev-parse $(cat /tmp/rev-parse-head))" >> $GITHUB_OUTPUT
    - name: echo git-ref
      run: echo ${{ steps.git-ref.outputs.GIT_REF }}
    - name: get build tag
      id: build-tag
      run: echo "BUILD_TAG=$(cat /tmp/tag)" >> $GITHUB_OUTPUT
    - name: echo build-tag
      run: echo ${{ steps.build-tag.outputs.BUILD_TAG }}
    - name: check ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ steps.git-ref.outputs.GIT_REF }} can be pulled
      id: catalog-git-ref-exist
      if: ${{ github.event_name != 'workflow_dispatch' }}
      continue-on-error: true
      env:
        GIT_REF_TAG: ${{ steps.git-ref.outputs.GIT_REF }}
      run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${GIT_REF_TAG}
    - name: check ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ steps.build-tag.outputs.BUILD_TAG }} can be pulled
      id: catalog-build-tag-exist
      if: ${{ github.event_name != 'workflow_dispatch' }}
      continue-on-error: true
      env:
        BUILD_TAG_VAR: ${{ steps.build-tag.outputs.BUILD_TAG }}
      run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${BUILD_TAG_VAR}
    - name: get year month date hour minutes
      id: dateversion
      run: echo "YMdHM=$(date -u +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
    - name: echo dateversion
      run: echo ${{ steps.dateversion.outputs.YMdHM }}
    - name: get version prefix based on channel
      id: version-prefix
      run: |
        case "${{ matrix.channel }}" in
          dev) echo "PREFIX=99.0" >> $GITHUB_OUTPUT ;;
          stable-1.6) echo "PREFIX=1.60" >> $GITHUB_OUTPUT ;;
          stable-1.5) echo "PREFIX=1.50" >> $GITHUB_OUTPUT ;;
          stable-1.4) echo "PREFIX=1.40" >> $GITHUB_OUTPUT ;;
          stable-1.3) echo "PREFIX=1.30" >> $GITHUB_OUTPUT ;;
          stable-1.2) echo "PREFIX=1.20" >> $GITHUB_OUTPUT ;;
          stable-1.1) echo "PREFIX=1.10" >> $GITHUB_OUTPUT ;;
          stable-1.0) echo "PREFIX=1.00" >> $GITHUB_OUTPUT ;;
          *) echo "PREFIX=0.99" >> $GITHUB_OUTPUT ;;
        esac
    - name: echo version prefix
      run: echo "Version will be ${{ steps.version-prefix.outputs.PREFIX }}.${{ steps.dateversion.outputs.YMdHM }}"

    # Install the cosign tool except on PR
    # https://github.com/sigstore/cosign-installer
    - uses: actions/setup-go@v6
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success' }}
      with:
        go-version: '^1.25.0' # The Go version to download (if necessary) and use.
    - run: go version
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success' }}
    - name: install operator-sdk opm
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success' }}
      run: |
        export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
        export OS=$(uname | awk '{print tolower($0)}')
        export OPERATOR_SDK_DL_URL=https://github.com/operator-framework/operator-sdk/releases/download/v1.35.0
        curl -LO ${OPERATOR_SDK_DL_URL}/operator-sdk_${OS}_${ARCH}
        chmod +x operator-sdk_${OS}_${ARCH} && sudo mv operator-sdk_${OS}_${ARCH} /usr/local/bin/operator-sdk

        export OPM_DL_URL=https://github.com/operator-framework/operator-registry/releases/download/v1.64.0
        curl -LO ${OPM_DL_URL}/${OS}-${ARCH}-opm
        chmod +x ${OS}-${ARCH}-opm && sudo mv ${OS}-${ARCH}-opm /usr/local/bin/opm
    - name: Install cosign
      if: ${{ github.event_name != 'pull_request' && (steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success') }}
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.4.1'
    # Workaround: https://github.com/docker/build-push-action/issues/461
    - name: Set up QEMU
      id: qemu
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success' }}
      uses: docker/setup-qemu-action@v4
      with:
        image: tonistiigi/binfmt:latest
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    - name: Setup Docker buildx
      id: buildx
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success' }}
      uses: docker/setup-buildx-action@v4
    # Login against a Docker registry except on PR
    # https://github.com/docker/login-action
    - name: Available platforms
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success' }}
      run: echo ${{ steps.buildx.outputs.platforms }}
    - name: Log into registry ${{ env.REGISTRY }}
      if: ${{ github.event_name != 'pull_request' && (steps.catalog-git-ref-exist.outcome != 'success' || steps.catalog-build-tag-exist.outcome != 'success') }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Extract metadata (tags, labels) for Docker
    # https://github.com/docker/metadata-action
    - name: Extract Docker metadata
      id: meta-git-ref
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' }}
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.git-ref.outputs.GIT_REF }}
    - name: Extract Docker metadata
      id: meta-build-tag
      if: ${{ steps.catalog-build-tag-exist.outcome != 'success' }}
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.build-tag.outputs.BUILD_TAG }}
    # Build and push Docker image with Buildx (don't push on PR)
    # https://github.com/docker/build-push-action
    - name: Build and push Docker image
      id: build-and-push-git-ref
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' }}
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-git-ref.outputs.tags }}
        labels: ${{ steps.meta-git-ref.outputs.labels }}
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    # Build and push Docker image with Buildx (don't push on PR)
    # https://github.com/docker/build-push-action
    - name: Build and push Docker image
      id: build-and-push-build-tag
      if: ${{ steps.catalog-build-tag-exist.outcome != 'success' }}
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-build-tag.outputs.tags }}
        labels: ${{ steps.meta-build-tag.outputs.labels }}
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    # Sign the resulting Docker image digest except on PRs.
    # This will only write to the public Rekor transparency log when the Docker
    # repository is public to avoid leaking data.  If you would like to publish
    # transparency data even for private images, pass --force to cosign below.
    # https://github.com/sigstore/cosign
    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' && steps.catalog-git-ref-exist.outcome != 'success' }}
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_YES: "true"
      # This step uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push-git-ref.outputs.digest }}
    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' && steps.catalog-build-tag-exist.outcome != 'success' }}
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_YES: "true"
      # This step uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push-build-tag.outputs.digest }}
    - name: make bundle
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' }}
      run: CHANNELS=${{ matrix.channel }} DEFAULT_CHANNEL=${{ matrix.channel }} VERSION=${{ steps.version-prefix.outputs.PREFIX }}.${{ steps.dateversion.outputs.YMdHM }} IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push-git-ref.outputs.digest }} make replace-icon bundle
    - name: Extract Docker metadata
      id: meta-bundle-git-ref
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' }}
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle
        tags: |
          type=raw,value=${{ steps.git-ref.outputs.GIT_REF }}
    - name: Extract Docker metadata
      id: meta-bundle-build-tag
      if: ${{ steps.catalog-build-tag-exist.outcome != 'success' }}
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle
        tags: |
          type=raw,value=${{ steps.build-tag.outputs.BUILD_TAG }}
    # Build and push Docker image with Buildx (don't push on PR)
    # https://github.com/docker/build-push-action
    - name: Build and push Docker image
      id: build-and-push-bundle-git-ref
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' }}
      uses: docker/build-push-action@v7
      with:
        file: bundle.Dockerfile
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-bundle-git-ref.outputs.tags }}
        labels: ${{ steps.meta-bundle-git-ref.outputs.labels }}
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    # Build and push Docker image with Buildx (don't push on PR)
    # https://github.com/docker/build-push-action
    - name: Build and push Docker image
      id: build-and-push-bundle-build-tag
      if: ${{ steps.catalog-build-tag-exist.outcome != 'success' }}
      uses: docker/build-push-action@v7
      with:
        file: bundle.Dockerfile
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-bundle-build-tag.outputs.tags }}
        labels: ${{ steps.meta-bundle-build-tag.outputs.labels }}
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    # Sign the resulting Docker image digest except on PRs.
    # This will only write to the public Rekor transparency log when the Docker
    # repository is public to avoid leaking data.  If you would like to publish
    # transparency data even for private images, pass --force to cosign below.
    # https://github.com/sigstore/cosign
    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' && steps.catalog-git-ref-exist.outcome != 'success' }}
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_YES: "true"
      # This step uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle@${{ steps.build-and-push-bundle-git-ref.outputs.digest }}
    # Sign the resulting Docker image digest except on PRs.
    # This will only write to the public Rekor transparency log when the Docker
    # repository is public to avoid leaking data.  If you would like to publish
    # transparency data even for private images, pass --force to cosign below.
    # https://github.com/sigstore/cosign
    - name: Sign the published Docker image
      if: ${{ github.event_name != 'pull_request' && steps.catalog-build-tag-exist.outcome != 'success'}}
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_YES: "true"
      # This step uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle@${{ steps.build-and-push-bundle-build-tag.outputs.digest }}
    - name: add bundle to git ref catalog build and push
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' }}
      run: |
        make catalog-build catalog-push \
          OPM=/usr/local/bin/opm \
          CONTAINER_TOOL=docker \
          OPM_VERSION=v1.64.0 \
          DEFAULT_CHANNEL=${{ matrix.channel }} \
          VERSION=${{ steps.version-prefix.outputs.PREFIX }}.${{ steps.dateversion.outputs.YMdHM }} \
          BUNDLE_IMGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle:${{ steps.git-ref.outputs.GIT_REF }} \
          CATALOG_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ steps.git-ref.outputs.GIT_REF }}
    - name: add bundle to ${{ steps.build-tag.outputs.BUILD_TAG }} existing catalog build and push
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' && steps.catalog-build-tag-exist.outcome == 'success' }}
      id: add-to-existing-catalog
      continue-on-error: true
      run: |
        make catalog-build-replaces catalog-push \
          OPM=/usr/local/bin/opm \
          CONTAINER_TOOL=docker \
          OPM_VERSION=v1.64.0 \
          DEFAULT_CHANNEL=${{ matrix.channel }} \
          VERSION=${{ steps.version-prefix.outputs.PREFIX }}.${{ steps.dateversion.outputs.YMdHM }} \
          BUNDLE_IMGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle:${{ steps.git-ref.outputs.GIT_REF }} \
          CATALOG_BASE_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ steps.build-tag.outputs.BUILD_TAG }} \
          CATALOG_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ steps.build-tag.outputs.BUILD_TAG }}
    - name: if existing fail, add bundle to new ${{ steps.build-tag.outputs.BUILD_TAG }} catalog build and push
      if: ${{ steps.catalog-git-ref-exist.outcome != 'success' && steps.catalog-build-tag-exist.outcome != 'success'}}
      run: |
        make catalog-build-replaces catalog-push \
          OPM=/usr/local/bin/opm \
          CONTAINER_TOOL=docker \
          OPM_VERSION=v1.64.0 \
          DEFAULT_CHANNEL=${{ matrix.channel }} \
          VERSION=${{ steps.version-prefix.outputs.PREFIX }}.${{ steps.dateversion.outputs.YMdHM }} \
          BUNDLE_IMGS=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle:${{ steps.git-ref.outputs.GIT_REF }} \
          CATALOG_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ steps.build-tag.outputs.BUILD_TAG }}
    - name: git add
      run: git add .
    - name: git status
      run: git status
    - name: git diff
      run: git diff upstream/${{ matrix.branch }}

  combine-edge-catalog:
    name: Create combined edge catalog with all channels
    runs-on: ubuntu-latest
    needs: publish-new-edge-catalog
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - name: get year month date hour minutes
      id: dateversion
      run: echo "YMdHM=$(date -u +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
    - name: install opm
      run: |
        export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
        export OS=$(uname | awk '{print tolower($0)}')
        export OPM_DL_URL=https://github.com/operator-framework/operator-registry/releases/download/v1.64.0
        curl -LO ${OPM_DL_URL}/${OS}-${ARCH}-opm
        chmod +x ${OS}-${ARCH}-opm && sudo mv ${OS}-${ARCH}-opm /usr/local/bin/opm
    - name: Install cosign
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.4.1'
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        image: tonistiigi/binfmt:latest
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4
    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build combined catalog with all channels
      run: |
        rm -rf catalog.Dockerfile catalog/
        mkdir -p catalog/oadp-operator

        # Create channels list
        CHANNELS=("dev" "stable-1.6" "stable-1.5" "stable-1.4" "stable-1.3" "stable-1.2" "stable-1.1" "stable-1.0")

        # Render all bundles into the catalog
        for CHANNEL in "${CHANNELS[@]}"; do
          BUNDLE_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle:${CHANNEL}"
          echo "Rendering bundle for channel ${CHANNEL}: ${BUNDLE_IMG}"
          opm render ${BUNDLE_IMG} -o yaml >> catalog/oadp-operator/index.yaml || {
            echo "Warning: Failed to render bundle for ${CHANNEL}, skipping"
            continue
          }
        done

        # Add package definition with dev as default channel
        cat >> catalog/oadp-operator/index.yaml <<'EOF'
        ---
        schema: olm.package
        name: oadp-operator
        defaultChannel: dev
        EOF

        # Add channel definitions - each channel has one bundle entry
        for CHANNEL in "${CHANNELS[@]}"; do
          BUNDLE_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bundle:${CHANNEL}"
          # Extract the bundle name (CSV name) from the bundle image
          BUNDLE_NAME=$(opm render ${BUNDLE_IMG} -o json 2>/dev/null | jq -r 'select(.schema == "olm.bundle") | .name' | head -1)

          if [ -n "$BUNDLE_NAME" ]; then
            echo "Adding channel ${CHANNEL} with bundle ${BUNDLE_NAME}"
            cat >> catalog/oadp-operator/index.yaml <<EOF
        ---
        schema: olm.channel
        name: ${CHANNEL}
        package: oadp-operator
        entries:
          - name: ${BUNDLE_NAME}
        EOF
          else
            echo "Warning: Could not extract bundle name for ${CHANNEL}"
          fi
        done

        opm validate catalog/
        opm generate dockerfile catalog/ --binary-image=quay.io/operator-framework/opm:v1.64.0
    - name: Build and push edge catalog image
      id: build-and-push-edge-catalog
      uses: docker/build-push-action@v7
      with:
        file: catalog.Dockerfile
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:edge
        platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
    - name: Sign the edge catalog image
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_YES: "true"
      run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog@${{ steps.build-and-push-edge-catalog.outputs.digest }}
    - name: Cleanup
      run: rm -rf catalog.Dockerfile catalog/
